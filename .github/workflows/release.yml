name: Build and publish release

on:
  push:
    tags:
      - 'codex-v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Verify release tag and source version
        shell: pwsh
        run: |
          $source = Get-Content -Raw -LiteralPath 'usage_monitor_for_claude/__init__.py'
          $match = [regex]::Match($source, "__version__\s*=\s*'([^']+)'")
          if (-not $match.Success) {
            throw 'Could not read __version__ from usage_monitor_for_claude/__init__.py'
          }

          $version = $match.Groups[1].Value
          $expectedTag = "codex-v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match source version '$expectedTag'"
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Build executable
        shell: pwsh
        run: python build.py

      - name: Verify executable and write checksum
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'dist/UsageMonitorForCodex.exe'
          $expectedFileVersion = "$env:RELEASE_VERSION.0"
          if ($exe.VersionInfo.FileVersion -ne $expectedFileVersion) {
            throw "EXE version '$($exe.VersionInfo.FileVersion)' does not match '$expectedFileVersion'"
          }

          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UsageMonitorForCodex.exe" | Set-Content -LiteralPath 'dist/UsageMonitorForCodex.exe.sha256' -Encoding ascii

      - name: Prepare release notes
        shell: pwsh
        run: |
          $changelog = Get-Content -Raw -LiteralPath 'CHANGELOG.md'
          $version = [regex]::Escape($env:RELEASE_VERSION)
          $pattern = "(?ms)^## \[$version\] - [^\r\n]+\r?\n(?<body>.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no dated section for $env:RELEASE_VERSION"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $readmeUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME/README.md"
          $notes = $match.Groups['body'].Value.Trim() + "`n`n[README for this release]($readmeUrl)"
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsageMonitorForCodex-${{ github.ref_name }}
          path: |
            dist/UsageMonitorForCodex.exe
            dist/UsageMonitorForCodex.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'dist/UsageMonitorForCodex.exe#UsageMonitorForCodex.exe' `
            'dist/UsageMonitorForCodex.exe.sha256#SHA-256 checksum' `
            --verify-tag `
            --latest `
            --title "Usage Monitor for Codex $env:RELEASE_VERSION" `
            --notes-file $env:RELEASE_NOTES_PATH
